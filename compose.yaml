services:
  aruco-landing:
    build:
      context: .
      args:
        ARUCO_REPOSITORY: ${ARUCO_REPOSITORY:-https://github.com/Aki0290/aruco_landing_docker.git}
        ARUCO_REF: ${ARUCO_REF:-main}
    image: aruco-landing-pi4:humble
    container_name: aruco-landing-pi4
    privileged: true
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    volumes:
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config:/config:ro
      - ./runtime:/runtime
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY:-:0}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FCU_URL: ${FCU_URL:-serial:///dev/serial0:115200}
      FCU_BAUD: ${FCU_BAUD:-115200}
      GCS_URL: ${GCS_URL:-}
      COLOR_PROFILE: ${COLOR_PROFILE:-640x480x15}
      DEPTH_PROFILE: ${DEPTH_PROFILE:-640x360x15}
      CAMERA_DRIVER: ${CAMERA_DRIVER:-realsense}
      USB_CAMERA_DEVICE: ${USB_CAMERA_DEVICE:-/dev/video0}
      USB_CAMERA_WIDTH: ${USB_CAMERA_WIDTH:-640}
      USB_CAMERA_HEIGHT: ${USB_CAMERA_HEIGHT:-480}
      USB_CAMERA_FPS: ${USB_CAMERA_FPS:-15}
      USB_CAMERA_PIXEL_FORMAT: ${USB_CAMERA_PIXEL_FORMAT:-YUYV}
      USB_CAMERA_OUTPUT_ENCODING: ${USB_CAMERA_OUTPUT_ENCODING:-rgb8}
      USB_CAMERA_INFO_URL: ${USB_CAMERA_INFO_URL:-}
      USB_CAMERA_FRAME: ${USB_CAMERA_FRAME:-usb_camera_color_optical_frame}
      USB_CAMERA_OFFSET_X: ${USB_CAMERA_OFFSET_X:-0.075}
      USB_CAMERA_OFFSET_Y: ${USB_CAMERA_OFFSET_Y:-0.0}
      USB_CAMERA_OFFSET_Z: ${USB_CAMERA_OFFSET_Z:--0.15}
      DETECTION_ONLY: ${DETECTION_ONLY:-true}
      ENABLE_DEPTH: ${ENABLE_DEPTH:-true}
      ENABLE_IMU: ${ENABLE_IMU:-false}
      ENABLE_POINTCLOUD: ${ENABLE_POINTCLOUD:-false}
      ALIGN_DEPTH: ${ALIGN_DEPTH:-false}
      SEARCH_HEIGHT: ${SEARCH_HEIGHT:-2.0}
      LANDING_MARKER_ID: ${LANDING_MARKER_ID:-102}
      MARKER_LENGTH: ${MARKER_LENGTH:-0.15}
      CENTERING_TOLERANCE: ${CENTERING_TOLERANCE:-0.15}
      CENTER_CONFIRM_FRAMES: ${CENTER_CONFIRM_FRAMES:-5}
      MARKER_LOST_TIMEOUT: ${MARKER_LOST_TIMEOUT:-1.0}
      CENTERING_COMMAND_RATE: ${CENTERING_COMMAND_RATE:-5.0}
      CENTERING_MAX_STEP: ${CENTERING_MAX_STEP:-0.04}
      CENTERING_MIN_STEP: ${CENTERING_MIN_STEP:-0.005}
      CENTERING_SLOW_RADIUS: ${CENTERING_SLOW_RADIUS:-0.75}
      SEARCH_ANGLE_STEP_DEG: ${SEARCH_ANGLE_STEP_DEG:-0.36}
      MAX_SEARCH_RADIUS: ${MAX_SEARCH_RADIUS:-3.0}
      GEOFENCE_RADIUS: ${GEOFENCE_RADIUS:-3.5}
      PROBE_GRID_SIZE: ${PROBE_GRID_SIZE:-1.0}
      PROBE_NOSE_POINTS_POSITIVE_Y: ${PROBE_NOSE_POINTS_POSITIVE_Y:-true}
      ENABLE_PROBE_PRACTICE: ${ENABLE_PROBE_PRACTICE:-true}
      PROBE_HUE_MIN: ${PROBE_HUE_MIN:-25}
      PROBE_HUE_MAX: ${PROBE_HUE_MAX:-45}
      PROBE_SATURATION_MIN: ${PROBE_SATURATION_MIN:-100}
      PROBE_VALUE_MIN: ${PROBE_VALUE_MIN:-100}
      PROBE_MIN_AREA: ${PROBE_MIN_AREA:-150}
      PROBE_MAX_AREA: ${PROBE_MAX_AREA:-60000}
      PROBE_MIN_SOLIDITY: ${PROBE_MIN_SOLIDITY:-0.80}
      PROBE_MIN_ASPECT: ${PROBE_MIN_ASPECT:-3.5}
      PROBE_MAX_ASPECT: ${PROBE_MAX_ASPECT:-10.0}
      PROBE_MIN_RECT_FILL: ${PROBE_MIN_RECT_FILL:-0.60}
      PROBE_LENGTH: ${PROBE_LENGTH:-0.20}
      PROBE_MIN_DIAMETER: ${PROBE_MIN_DIAMETER:-0.02}
      PROBE_MAX_DIAMETER: ${PROBE_MAX_DIAMETER:-0.03}
      PROBE_SIZE_TOLERANCE: ${PROBE_SIZE_TOLERANCE:-0.55}
      PROBE_CONFIRM_FRAMES: ${PROBE_CONFIRM_FRAMES:-5}
      PROBE_CONFIRM_RADIUS: ${PROBE_CONFIRM_RADIUS:-0.25}
      PRACTICE_BASE_HEIGHT: ${PRACTICE_BASE_HEIGHT:-2.0}
      OPERATION_MODE: ${OPERATION_MODE:-practice}
      START_LANDING_NODE: ${START_LANDING_NODE:-true}
      AUTONOMOUS_FLIGHT_ACK: ${AUTONOMOUS_FLIGHT_ACK:-NOT_ACKNOWLEDGED}
      DEVICE_WAIT_TIMEOUT: ${DEVICE_WAIT_TIMEOUT:-120}
      # 0: Pi/DockerがFCより先に起動しても無期限に接続を待つ。
      READY_TIMEOUT: ${READY_TIMEOUT:-0}
      READY_STABLE_COUNT: ${READY_STABLE_COUNT:-3}
      START_TRIGGER: ${START_TRIGGER:-rc}
      RC_START_CHANNEL: ${RC_START_CHANNEL:-7}
      RC_LOW_THRESHOLD: ${RC_LOW_THRESHOLD:-1200}
      RC_HIGH_THRESHOLD: ${RC_HIGH_THRESHOLD:-1800}
      RC_HIGH_HOLD_SECONDS: ${RC_HIGH_HOLD_SECONDS:-1.0}
      REQUIRE_RC_LOW_FIRST: ${REQUIRE_RC_LOW_FIRST:-true}
      STATUS_LED_TYPE: ${STATUS_LED_TYPE:-ws281x}
      STATUS_LED_GPIO: ${STATUS_LED_GPIO:-18}
      STATUS_LED_COUNT: ${STATUS_LED_COUNT:-8}
      STATUS_LED_BRIGHTNESS: ${STATUS_LED_BRIGHTNESS:-64}
      RGB_LED_RED_GPIO: ${RGB_LED_RED_GPIO:-17}
      RGB_LED_GREEN_GPIO: ${RGB_LED_GREEN_GPIO:-27}
      RGB_LED_BLUE_GPIO: ${RGB_LED_BLUE_GPIO:-22}
      AUTO_START_DELAY: ${AUTO_START_DELAY:-5}
      ARM_TEST_SECONDS: ${ARM_TEST_SECONDS:-5.0}
    healthcheck:
      test: ["CMD", "/usr/local/bin/aruco-healthcheck"]
      interval: 15s
      # Pi 4ではROS 2 discoveryの2回分で10秒を超えることがある。
      timeout: 25s
      retries: 10
      start_period: 90s
